name: Source addition or correction
description: Propose a public-safe canonical source or correct an existing record.
title: "[Source]: "
labels:
  - "type: source"
body:
  - type: input
    id: canonical_url
    attributes:
      label: Canonical HTTPS URL
      placeholder: https://example.org/
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: Admission and ownership evidence
      description: Link official documentation, a canonical repository, or other public evidence.
    validations:
      required: true
  - type: dropdown
    id: change
    attributes:
      label: Change type
      options:
        - Add a source
        - Correct metadata or ownership
        - Replace a stale URL
        - Remove an unsafe or invalid source
    validations:
      required: true
  - type: checkboxes
    id: boundary
    attributes:
      label: Public-data boundary
      options:
        - label: I have not included private bookmarks, account data, credentials, or private-repository evidence.
          required: true
