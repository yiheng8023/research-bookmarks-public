name: Taxonomy or placement issue
description: Propose a category or subdomain correction with a concrete example.
title: "[Taxonomy]: "
labels:
  - "type: taxonomy"
body:
  - type: input
    id: source
    attributes:
      label: Source ID or canonical URL
    validations:
      required: true
  - type: input
    id: current
    attributes:
      label: Current category and subdomain
    validations:
      required: true
  - type: input
    id: proposed
    attributes:
      label: Proposed category and subdomain
    validations:
      required: true
  - type: textarea
    id: rationale
    attributes:
      label: Evidence and rationale
      description: Explain the resource's primary function and why the proposed ownership is more accurate.
    validations:
      required: true
