# Repository-owned label vocabulary for structured issue forms.
- name: "type: source"
  color: "1d76db"
  description: "A public-safe source addition, correction, replacement, or removal."
- name: "type: taxonomy"
  color: "5319e7"
  description: "A category, subdomain, naming, or placement correction."
- name: "area: catalogue"
  color: "0e8a16"
  description: "Structured public sources and generated bookmark artifacts."
- name: "area: governance"
  color: "c5def5"
  description: "Public/private boundaries, contribution, support, or community policy."
- name: "status: needs-evidence"
  color: "b60205"
  description: "The proposal needs stronger public evidence before admission."
